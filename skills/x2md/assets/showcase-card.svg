<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
  </defs>
  <rect width="920" height="290" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="42" fill="#58a6ff" font-size="22" font-weight="bold">x2md — 转了还对</text>
  <text x="30" y="66" fill="#8b949e" font-size="13">markitdown 0.1.7 四件静默损坏修复 · 证据可复录：<tspan fill="#58a6ff" font-family="ui-monospace, Consolas, monospace">python scripts/demo_showcase.py</tspan></text>

  <!-- PROOF 1: formula -->
  <rect x="30" y="92" width="280" height="170" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="118" fill="#f0f6fc" font-size="15" font-weight="bold">① 公式逃逸修复</text>
  <text x="46" y="138" fill="#8b949e" font-size="11">markitdown 0.1.7 把 $...$ 内 * _ ^ 转错</text>
  <text x="46" y="178" fill="#f85149" font-size="44" font-weight="bold">19</text>
  <text x="118" y="170" fill="#8b949e" font-size="13">bad escapes</text>
  <text x="118" y="186" fill="#8b949e" font-size="11">(raw markitdown)</text>
  <text x="46" y="215" fill="#3fb950" font-size="14">→ AFTER x2md:</text>
  <text x="46" y="248" fill="#3fb950" font-size="44" font-weight="bold">0</text>
  <text x="92" y="248" fill="#8b949e" font-size="13">escapes</text>

  <!-- PROOF 2: table -->
  <rect x="320" y="92" width="280" height="170" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="336" y="118" fill="#f0f6fc" font-size="15" font-weight="bold">② 表格 D2 检测</text>
  <text x="336" y="138" fill="#8b949e" font-size="11">合并单元格错位（数据错列不报错）</text>
  <text x="336" y="185" fill="#58a6ff" font-size="52" font-weight="bold">35</text>
  <text x="408" y="178" fill="#8b949e" font-size="13">行 sidecar</text>
  <text x="408" y="194" fill="#8b949e" font-size="11">.errors.md</text>
  <text x="336" y="222" fill="#8b949e" font-size="12">CAUSE · MD_LOCATION</text>
  <text x="336" y="240" fill="#8b949e" font-size="12">· HTML_REFERENCE</text>

  <!-- PROOF 3: xlsx -->
  <rect x="610" y="92" width="280" height="170" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="626" y="118" fill="#f0f6fc" font-size="15" font-weight="bold">③ XLSX 公式求值</text>
  <text x="626" y="138" fill="#8b949e" font-size="11">程序生成的 =A+B 全 NaN → 实数</text>
  <text x="626" y="185" fill="#3fb950" font-size="52" font-weight="bold">15/15</text>
  <text x="626" y="222" fill="#8b949e" font-size="12">cells resolved</text>
  <text x="626" y="240" fill="#8b949e" font-size="12">(formulas 库写回 &lt;v&gt; 缓存)</text>

  <text x="30" y="282" fill="#6e7681" font-size="10">活体证据 · 2026-08-10 复录 · tests/output/showcase/summary.txt</text>
</svg>
