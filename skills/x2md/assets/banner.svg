<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Left: logo block -->
  <rect x="40" y="50" width="100" height="100" rx="16" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="90" y="95" text-anchor="middle" fill="#58a6ff" font-size="36" font-weight="700">md</text>
  <text x="90" y="128" text-anchor="middle" fill="#3fb950" font-size="28" font-weight="700">+✓</text>

  <!-- Right: title + tagline -->
  <text x="170" y="80" fill="#f0f6fc" font-size="32" font-weight="700">x2md</text>
  <text x="170" y="112" fill="#8b949e" font-size="16">MarkItDown 的正确性补丁层</text>
  <text x="170" y="138" fill="#c9d1d9" font-size="15">本家能转，enhanced 转了还对</text>

  <!-- Fix badges row -->
  <g font-size="12" font-weight="600">
    <rect x="170" y="152" width="92" height="22" rx="11" fill="#1f6feb" opacity="0.25"/>
    <text x="216" y="167" text-anchor="middle" fill="#79c0ff">公式不乱码</text>

    <rect x="270" y="152" width="92" height="22" rx="11" fill="#238636" opacity="0.3"/>
    <text x="316" y="167" text-anchor="middle" fill="#7ee787">表格不错列</text>

    <rect x="370" y="152" width="92" height="22" rx="11" fill="#8957e5" opacity="0.3"/>
    <text x="416" y="167" text-anchor="middle" fill="#d2a8ff">加密不卡壳</text>

    <rect x="470" y="152" width="92" height="22" rx="11" fill="#d29922" opacity="0.3"/>
    <text x="516" y="167" text-anchor="middle" fill="#e3b341">NaN 变实数</text>
  </g>
</svg>
